version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: rapportini_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapportini_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-rapportini_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    # Internal exposure only; ports not mapped to host in production
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rapportini_user} -d ${POSTGRES_DB:-rapportini_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: rapportini_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapportini_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rapportini_user}:${POSTGRES_PASSWORD:-dev_password_only}@db:5432/${POSTGRES_DB:-rapportini_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-only-local-secret-key-do-not-use-in-production-mode-32bytes}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    networks:
      - backend-network
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
