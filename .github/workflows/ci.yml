name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      # Disposable service container used only by the opt-in migrator integration test.
      MIGRATOR_TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/basegrid_migrator_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: basegrid_migrator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d basegrid_migrator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run backend type-check
        run: npm run typecheck:backend

      - name: Run frontend type-check
        run: npm run typecheck:frontend

      - name: Run Vitest test suite
        run: npm test

      - name: Run build
        run: npm run build
