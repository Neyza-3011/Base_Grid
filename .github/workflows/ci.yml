name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      # Disposable service container used only by the opt-in migrator integration test.
      MIGRATOR_TEST_DATABASE_URL: postgres://postgres:test-password@localhost:5432/basegrid_migrator_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: basegrid_migrator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d basegrid_migrator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install PDF validation tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes poppler-utils

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run backend type-check
        run: npm run typecheck:backend

      - name: Run frontend type-check
        run: npm run typecheck:frontend

      - name: Run Vitest test suite
        run: npm test

      - name: Run build
        run: npm run build

  backend-runtime-smoke:
    name: Backend Runtime Smoke Test (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: basegrid_backend_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d basegrid_backend_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI-only dependencies. Never point this job at production services.
      BASEGRID_RUNTIME_MODE: ai-studio
      PORT: "3000"
      DATABASE_URL: postgres://postgres:ci-only-postgres-password@localhost:5433/basegrid_backend_smoke
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-runtime-smoke-secret-not-for-production
      EMAIL_VERIFICATION_ENABLED: "false"
      GOOGLE_AUTH_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Build application bundle
        run: npm run build

      - name: Start compiled backend and verify health/readiness
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/basegrid-backend-smoke.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "----- Backend startup log -----"
            cat /tmp/basegrid-backend-smoke.log || true
          }
          trap cleanup EXIT

          node <<'NODE'
          const baseUrl = "http://127.0.0.1:3000";
          const deadline = Date.now() + 90000;
          let lastError = "server did not respond";
          async function request(path) {
            const response = await fetch(baseUrl + path, { signal: AbortSignal.timeout(3000) });
            const body = await response.text();
            return { status: response.status, body };
          }
          while (Date.now() < deadline) {
            try {
              const health = await request("/health");
              if (health.status !== 200) {
                throw new Error("/health returned HTTP " + health.status + ": " + health.body);
              }
              const ready = await request("/ready");
              if (ready.status === 200) {
                const parsed = JSON.parse(ready.body);
                if (parsed.status !== "ready") {
                  throw new Error("/ready returned HTTP 200 without status=ready");
                }
                console.log("Backend smoke test passed: /health=200 and /ready=200 (PostgreSQL + Redis).");
                process.exit(0);
              }
              lastError = "/ready returned HTTP " + ready.status + ": " + ready.body;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          console.error("Backend runtime smoke test failed: " + lastError);
          process.exit(1);
          NODE
